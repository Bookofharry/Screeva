name: Build & Publish Standalone Releases (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag to publish (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --import tsx --test tests/launcher.test.ts
      - run: npm prune --omit=dev
      - name: Assemble Screeva.app and macOS DMG/ZIP
        run: |
          set -euo pipefail
          STAGE="release-mac/Screeva"
          APP_BUNDLE="$STAGE/Screeva.app"
          CONTENTS="$APP_BUNDLE/Contents"
          APP_ROOT="$CONTENTS/Resources/app"

          mkdir -p "$STAGE"
          osacompile -o "$APP_BUNDLE" packaging/macos/Screeva.applescript
          mkdir -p "$APP_ROOT/apps/client" "$APP_ROOT/runtime"
          cp package.json LICENSE README.md "$APP_ROOT/"
          cp -R apps/client/dist "$APP_ROOT/apps/client/dist"
          cp -R dist "$APP_ROOT/dist"
          cp -R node_modules "$APP_ROOT/node_modules"
          cp "$(command -v node)" "$APP_ROOT/runtime/node"
          chmod +x "$APP_ROOT/runtime/node"
          cp packaging/README.txt "$STAGE/SETUP.txt"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier app.screeva.studio" "$CONTENTS/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string app.screeva.studio" "$CONTENTS/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Screeva" "$CONTENTS/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleName string Screeva" "$CONTENTS/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$CONTENTS/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$CONTENTS/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string app.screeva.studio" "$CONTENTS/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$CONTENTS/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string screeva" "$CONTENTS/Info.plist"
          plutil -lint "$CONTENTS/Info.plist"

          codesign --force --deep --sign - "$APP_BUNDLE"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" Screeva-macOS-arm64.zip
          hdiutil create -volname "Screeva" -srcfolder "$STAGE" -ov -format UDZO Screeva-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            Screeva-macOS-arm64.dmg
            Screeva-macOS-arm64.zip

  package-windows:
    name: Package Windows (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --import tsx --test tests/launcher.test.ts
      - run: npm prune --omit=dev
      - name: Assemble Windows standalone bundle
        shell: pwsh
        run: |
          $Stage = "release-win/Screeva"
          New-Item -ItemType Directory -Force -Path "$Stage/apps/client", "$Stage/runtime", "$Stage/data" | Out-Null

          Copy-Item package.json, LICENSE, README.md -Destination $Stage
          Copy-Item -Recurse apps/client/dist "$Stage/apps/client/dist"
          Copy-Item -Recurse dist "$Stage/dist"
          Copy-Item -Recurse node_modules "$Stage/node_modules"
          Copy-Item (Get-Command node).Source "$Stage/runtime/node.exe"

          Copy-Item 'packaging/windows/*.cmd' -Destination $Stage
          Copy-Item packaging/README.txt "$Stage/SETUP.txt"

          Compress-Archive -Path $Stage -DestinationPath Screeva-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Screeva-Windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Determine release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$REF_NAME"
          else
            RELEASE_TAG="$INPUT_TAG"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a version tag such as v0.1.1"; exit 1; }
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Screeva ${{ steps.tag.outputs.tag_name }} — macOS & Windows Standalone Studio"
          body: |
            ## Screeva (`screeva.`) — Your Screen. Your Studio.

            Prebuilt standalone bundles for **macOS** and **Windows** (includes an embedded Node.js 24 runtime — no developer tools or `npm install` required).

            ### One-time setup
            - **Windows:** Extract the ZIP to a permanent folder and run **Enable Screeva links.cmd** once. **Start Screeva.cmd** also launches directly.
            - **macOS Apple Silicon:** Move **Screeva.app** into Applications and open it once. Follow the normal macOS approval prompts; this build is not notarized.
            - On the website choose **Open local studio** and accept your browser's prompt. Older bundles need updating for this feature.
            - Keep the launcher/Terminal window open while recording. Stop recording before pressing Ctrl+C to stop the service.
            - FFmpeg and FFprobe remain separately installed prerequisites for durable finalization, recovery and MP4 export. See the included SETUP.txt.
          files: |
            artifacts/Screeva-macOS-arm64.dmg
            artifacts/Screeva-macOS-arm64.zip
            artifacts/Screeva-Windows-x64.zip
