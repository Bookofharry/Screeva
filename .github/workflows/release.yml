name: Build & Publish Standalone Releases (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm prune --omit=dev
      - name: Assemble Screeva.app and macOS DMG/ZIP
        run: |
          set -euo pipefail
          STAGE="release-mac/Screeva"
          APP_BUNDLE="$STAGE/Screeva.app"
          CONTENTS="$APP_BUNDLE/Contents"
          APP_ROOT="$CONTENTS/Resources/app"

          mkdir -p "$CONTENTS/MacOS" "$APP_ROOT/apps/client" "$APP_ROOT/runtime" "$APP_ROOT/data"

          cp package.json LICENSE README.md "$APP_ROOT/"
          cp -R apps/client/dist "$APP_ROOT/apps/client/dist"
          cp -R dist "$APP_ROOT/dist"
          cp -R node_modules "$APP_ROOT/node_modules"
          cp "$(command -v node)" "$APP_ROOT/runtime/node"
          chmod +x "$APP_ROOT/runtime/node"

          cat > "$CONTENTS/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Screeva</string>
            <key>CFBundleDisplayName</key>
            <string>Screeva</string>
            <key>CFBundleIdentifier</key>
            <string>app.screeva.studio</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>Screeva</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          cat > "$CONTENTS/MacOS/Screeva" << 'EOF'
          #!/bin/bash
          set -e
          CONTENTS_DIR="$(cd "$(dirname "$0")/.." && pwd)"
          APP_DIR="$CONTENTS_DIR/Resources/app"
          PORT="${PORT:-4317}"
          URL="http://127.0.0.1:${PORT}"

          if curl -fsS "${URL}/api/v1/capabilities" >/dev/null 2>&1; then
            open "${URL}"
            exit 0
          fi

          mkdir -p "$APP_DIR/data"
          cd "$APP_DIR"
          "$APP_DIR/runtime/node" "$APP_DIR/dist/apps/server/src/index.js" >/dev/null 2>&1 &
          SERVER_PID=$!

          for _ in {1..40}; do
            if curl -fsS "${URL}/api/v1/capabilities" >/dev/null 2>&1; then
              open "${URL}"
              break
            fi
            sleep 0.15
          done

          wait "$SERVER_PID"
          EOF
          chmod +x "$CONTENTS/MacOS/Screeva"

          cat > "$STAGE/Start Screeva.command" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/Screeva.app/Contents/MacOS/Screeva"
          EOF
          chmod +x "$STAGE/Start Screeva.command"

          cat > "$STAGE/Stop Screeva.command" << 'EOF'
          #!/bin/bash
          pkill -f "Resources/app/dist/apps/server/src/index.js" || true
          echo "Screeva local server stopped."
          EOF
          chmod +x "$STAGE/Stop Screeva.command"

          cat > "$STAGE/README-MAC.txt" << 'EOF'
          Screeva — Your Screen. Your Studio. (macOS Standalone Bundle)
          =============================================================

          1. Move the "Screeva" folder (or Screeva.app) to a writable folder such as Downloads, Desktop, or ~/Applications.
          2. Double-click "Screeva.app" (or "Start Screeva.command").
             - If macOS Gatekeeper warns that the app is from an unidentified developer:
               Right-click (Control-click) "Screeva.app" -> click "Open", OR run in Terminal:
               xattr -cr Screeva.app
          3. Screeva will start its local loopback server and open http://127.0.0.1:4317 in your browser.
          4. No Node.js installation is required (Node 24 is bundled inside Screeva.app).
          5. Optional: Install FFmpeg (`brew install ffmpeg`) if you want durable Save-to-computer finalization and crash salvage.
          EOF

          codesign --force --deep --sign - "$APP_BUNDLE"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" Screeva-macOS-arm64.zip
          hdiutil create -volname "Screeva" -srcfolder "$STAGE" -ov -format UDZO Screeva-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            Screeva-macOS-arm64.dmg
            Screeva-macOS-arm64.zip

  package-windows:
    name: Package Windows (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm prune --omit=dev
      - name: Assemble Windows standalone bundle
        shell: pwsh
        run: |
          $Stage = "release-win/Screeva"
          New-Item -ItemType Directory -Force -Path "$Stage/apps/client", "$Stage/runtime", "$Stage/data" | Out-Null

          Copy-Item package.json, LICENSE, README.md -Destination $Stage
          Copy-Item -Recurse apps/client/dist "$Stage/apps/client/dist"
          Copy-Item -Recurse dist "$Stage/dist"
          Copy-Item -Recurse node_modules "$Stage/node_modules"
          Copy-Item (Get-Command node).Source "$Stage/runtime/node.exe"

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist "data" mkdir "data"
          echo Starting Screeva on http://127.0.0.1:4317 ...
          start "" "http://127.0.0.1:4317"
          "%~dp0runtime\node.exe" "%~dp0dist\apps\server\src\index.js"
          pause
          '@ | Set-Content -Path "$Stage/Start Screeva.cmd" -Encoding ASCII

          @'
          Screeva — Your Screen. Your Studio. (Windows Standalone Bundle)
          ===============================================================

          1. Extract the "Screeva" folder anywhere on your computer.
          2. Double-click "Start Screeva.cmd".
          3. Your browser will open http://127.0.0.1:4317 automatically.
          4. Close the command window (or press Ctrl+C) when finished.
          '@ | Set-Content -Path "$Stage/README-WINDOWS.txt" -Encoding UTF8

          Compress-Archive -Path $Stage -DestinationPath Screeva-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Screeva-Windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ inputs.tag || 'v0.1.0' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Screeva ${{ steps.tag.outputs.tag_name }} — macOS & Windows Standalone Studio"
          body: |
            ## Screeva (`screeva.`) — Your Screen. Your Studio.

            Prebuilt standalone bundles for **macOS** and **Windows** (includes an embedded Node.js 24 runtime — no developer tools or `npm install` required).

            ### macOS (`Screeva-macOS-arm64.dmg` / `Screeva-macOS-arm64.zip`)
            1. Download **`Screeva-macOS-arm64.dmg`** (or `.zip`), extract/copy the **`Screeva`** folder to `Downloads`, `Desktop`, or `~/Applications`.
            2. Double-click **`Screeva.app`** (or **`Start Screeva.command`**).
               - *First-launch note on macOS:* Right-click (`Control`-click) `Screeva.app` → **Open**, or run `xattr -cr Screeva.app` in Terminal.
            3. Screeva starts its local loopback server and opens **http://127.0.0.1:4317** in your browser.

            ### Windows (`Screeva-Windows-x64.zip`)
            1. Download and extract **`Screeva-Windows-x64.zip`**.
            2. Double-click **`Start Screeva.cmd`**.
            3. Your browser opens **http://127.0.0.1:4317** automatically.
          files: |
            artifacts/Screeva-macOS-arm64.dmg
            artifacts/Screeva-macOS-arm64.zip
            artifacts/Screeva-Windows-x64.zip
